[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rmz-google-sheets"
version = "0.1.0"
description = "A small command-line tool for reading and editing Google Sheets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
]

[project.scripts]
rmz-sheets = "rmz_google_sheets.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
